{% extends "base.html" %}

{% block title %}Page Not Found - Room Radar{% endblock %}

{% block extra_css %}
<style>
    .error-page {
        min-height: calc(100vh - 64px - 220px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 64px 20px;
    }
    .error-code { font-family: var(--font-display); font-size: 88px; font-weight: 700; color: var(--color-navy); line-height: 1; }
    .error-page h2 { font-size: 22px; margin: 16px 0 8px; }
    .error-page p { color: var(--color-muted); font-size: 15px; max-width: 380px; margin-bottom: 28px; }
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-code">404</div>
    <h2>Page not found</h2>
    <p>The page you're looking for doesn't exist, or may have been moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Back to home</a>
</div>
{% endblock %}
